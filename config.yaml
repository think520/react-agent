llm:
  default_provider: "deepseek"
  providers:
    minimax:
      type: "minimax"
      base_url: "https://api.minimaxi.com/v1"
      api_key_env: "MINIMAX_API_KEY"
      model: "MiniMax-M2.7"
    deepseek:
      type: "deepseek"
      base_url: "https://api.deepseek.com/v1"
      api_key_env: "DEEPSEEK_API_KEY"
      model: "deepseek-v4-flash"
    openai:
      type: "openai"
      base_url: "https://api.openai.com/v1"
      api_key_env: "OPENAI_API_KEY"
      model: "gpt-4"

agent:
  temperature: 0.7
  max_retries: 3
  timeout: 300

session:
  save_dir: ".session"
  max_messages: 100

skills:
  enabled: true
  dir: "skills"

rag:
  embedding_backend: auto          # auto | local | ollama
  ollama_url: "http://localhost:11434"
  ollama_model: "qwen3-embedding:0.6b"
  probe_timeout: 3
  request_timeout: 10

memory:
  enabled: true
  dir: ".bobodan"

mcp:
  enabled: false
  connection_timeout: 30
  tool_call_timeout: 60
  servers: {}
  # Example server entry (kept commented for reference — uncomment
  # to enable). User-specific servers should live in a local override
  # file or in uncommitted local changes to this file.
  #
  #   amap-maps:
  #     transport: streamable_http
  #     url: "https://mcp.api-inference.modelscope.net/3afe787f778c49/mcp"

# Learning Agent Orchestrator v1 — 3 built-in specialists.
# YAML can only override behavior of Python-defined specialists;
# v1 does not allow creating a new specialist from YAML alone.
specialists:
  doc_reader:
    enabled: true
    timeout_seconds: 60
    max_iterations: 5
    allow_mcp: false
    allowed_tools:
      - read_file
      - rag_search
      - knowledge_status
  triage:
    enabled: true
    timeout_seconds: 30
    max_iterations: 2
    allow_mcp: false
    allowed_tools:
      - read_file
      - knowledge_status
  planner:
    enabled: true
    timeout_seconds: 120
    max_iterations: 8
    allow_mcp: false
    allowed_tools:
      - learning_path
      - learning_progress